[package]
name = "axum-web"
version = "0.1.12"
edition = "2024"
authors = ["Sheroz Khaydarov"]
description = "A sample starter project for building REST API Web service in Rust using axum, JWT, SQLx, PostgreSQL, and Redis"
readme = "README.md"
repository = "https://github.com/sheroz/axum-web"
license = "MIT"
rust-version = "1.96"

[dependencies]
dotenvy = "0.15"
axum = { version = "0.8" }
axum-extra = { version = "0.12", features = ["typed-header"] }
tokio = { version = "1.50", features = ["full"] }
bytes = "1.11"
tower-http = { version = "0.6", features = ["cors"] }
tracing = { version = "0.1", features = ["attributes"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
http-body-util = { version = "0.1" }
hyper = { version = "1.6", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.22", features = [
    "v4",
    "fast-rng",
    "macro-diagnostics",
    "serde",
] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"

redis = { version = "1.1", features = ["tokio-comp"] }
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "postgres",
    "uuid",
    "macros",
    "chrono",
] }

jsonwebtoken = {version = "10", default-features = false, features = ["aws_lc_rs"] }

[dev-dependencies]
serial_test = "3.4"
reqwest = { version = "0.13", features = ["json"] }

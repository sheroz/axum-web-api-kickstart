name: check & build & test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: EmbarkStudios/cargo-deny-action@v2
      with:
        rust-version: "1.96"

  cargo-fmt-clippy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Update the Rust toolchain
      run: rustup default 1.96 && rustup component add rustfmt && rustup component add clippy && rustc --version
    - name: Cargo formatting check
      run: cargo fmt --all -- --check
    - name: Cargo clippy check
      run: cargo clippy --all-targets --all-features

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build and run the docker services
      run: docker compose up -d
    - name: Wait for PostgreSQL
      run: |
        until docker compose exec -T postgres pg_isready -U admin -d axum_web; do
          docker compose logs postgres
          sleep 2
        done
    - name: Wait for Redis
      run: |
        until docker compose exec -T redis redis-cli ping; do
          docker compose logs redis
          sleep 2
        done
    - name: Update the Rust toolchain
      run: rustup default 1.96 && rustc --version
    - name: Run tests
      run: cargo test --verbose
    
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Update the Rust toolchain
      run: rustup default 1.96 && rustc --version
    - name: Build
      run: cargo build --verbose
